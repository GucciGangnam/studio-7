<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040404" />
    <meta name="description" content="Studio 7 — Design, develop, and deploy. We build distinctive digital products from concept to production." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Studio 7</title>

    <!-- Apply theme before paint to avoid a flash. Saved choice wins; with no
         saved choice, follow the OS preference (falls back to dark). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var light =
            t === "light" ||
            (t !== "dark" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Studio 7" />
    <meta property="og:description" content="Design, develop, and deploy. We build distinctive digital products from concept to production." />
    <meta property="og:image" content="/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Studio 7" />
    <meta name="twitter:description" content="Design, develop, and deploy. We build distinctive digital products from concept to production." />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
