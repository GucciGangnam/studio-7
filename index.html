<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040404" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Installed-app (PWA) name — pins the window title to "Studio 7" so Chrome
         can't fall back to a stale cached name from a prior app on this origin. -->
    <meta name="application-name" content="Studio 7" />
    <meta name="apple-mobile-web-app-title" content="Studio 7" />

    <!-- SEO:START — everything between these markers is regenerated per-route by
         scripts/prerender.mjs at build time. The values below are the home page. -->
    <title>Studio 7 — Design, Develop &amp; Deploy Digital Products</title>
    <meta name="description" content="Studio 7 is a digital product studio. We design, develop, and deploy distinctive web and mobile products — from concept to production. Front end, back end, and everything in between." />
    <meta name="keywords" content="digital product studio, web development, product design, app development, MVP development, UI UX design, full stack development, PWA" />
    <meta name="author" content="Studio 7" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://studio7.software/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Studio 7" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://studio7.software/" />
    <meta property="og:title" content="Studio 7 — Design, Develop &amp; Deploy Digital Products" />
    <meta property="og:description" content="A digital product studio. We design, develop, and deploy distinctive web and mobile products — from concept to production." />
    <meta property="og:image" content="https://studio7.software/og/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Studio 7 — Design · Develop · Deploy" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Studio 7 — Design, Develop &amp; Deploy Digital Products" />
    <meta name="twitter:description" content="A digital product studio. We design, develop, and deploy distinctive web and mobile products — from concept to production." />
    <meta name="twitter:image" content="https://studio7.software/og/og-default.png" />
    <meta name="twitter:image:alt" content="Studio 7 — Design · Develop · Deploy" />
    <!-- SEO:END -->

    <!-- Apply theme before paint to avoid a flash. Saved choice wins; with no
         saved choice, follow the OS preference (falls back to dark). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var light =
            t === "light" ||
            (t !== "dark" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
